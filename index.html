<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rieper Logistics – Scan App</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Barcodescanner (Module-Version wird in scanner.js importiert) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<h1>Rieper Logistics – Scan App</h1>

<!-- Mitarbeitnummer -->
<div class="section">
    <label>Mitarbeiternummer:</label>
    <input type="text" id="mitarbeiter" placeholder="z.B. 007">
    <button id="saveMitarbeiter">Speichern</button>
</div>

<hr>

<!-- Formular -->
<div class="section">
    <h2>Neuer Eintrag</h2>

    <label>Liefer/Abholscheinnummer (Barcode):</label>
    <input type="text" id="barcode">

    <button id="startScanner">📷 Barcode scannen</button>
    <button id="stopScanner" style="display:none;">🛑 Scanner stoppen</button>

    <div id="reader" style="display:none; width:100%; max-width:350px; margin-top:10px;"></div>

    <label>Spedition:</label>
    <select id="spedition">
        <option value="LOOSE">LOOSE</option>
        <option value="SANI">SANI</option>
    </select>

    <label>Artikel:</label>
    <input type="text" id="artikel" list="artikelListe" placeholder="Artikel auswählen oder eingeben">
    <datalist id="artikelListe">
        <option value="Badewannendrehsitz">
        <option value="Beratung">
        <option value="Pflegebett - Dali / Dali Low">
        <option value="Bettenprüfung">
        <option value="Bettschutzeinlagen">
        <option value="Badewannenlifter">
        <option value="Deckenbodenstan­ge">
        <option value="Duschklappsitz">
        <option value="Deckenlifter">
        <option value="Duschtoilettenstuhl Fahrbar">
        <option value="Duschstuhl mit Arm und Rückenlehne">
        <option value="Einsatzpauschale">
        <option value="Einlegerahmen">
        <option value="Elektrorollstuhl">
        <option value="Greifhilfe/Greifzange">
        <option value="Haltegriff Bohren oder Kleben">
        <option value="Haltegriff Saugnapf">
        <option value="Duschhocker">
        <option value="Karton">
        <option value="Sitzkissen">
        <option value="Sauerstoffkonzentrator">
        <option value="Patientenlifter">
        <option value="Rollstuhl (Standard, Aktiv, Leichtgewicht)">
        <option value="Standard Matratze">
        <option value="Multifunktionsrollstuhl">
        <option value="Mobiler Sauerstoffkonzentrator">
        <option value="Rampe">
        <option value="Anbau oder Reparaturen">
        <option value="Rollator">
        <option value="Rutschbrett">
        <option value="Schiebe-, Bremshilfe, Schubgerät, R20">
        <option value="Scooter">
        <option value="Sonstiges">
        <option value="Spannbettlaken">
        <option value="Spezialbett">
        <option value="Stechbecken">
        <option value="Stützklappgriff">
        <option value="Toilettensitzerhöhung - Ticco 2G">
        <option value="Beistelltisch">
        <option value="Bewegungstrainer">
        <option value="Transportstuhl">
        <option value="Treppensteiger">
        <option value="Toilettensitzerhöhung - TSE 120 / TSE 120Plus">
        <option value="Toilettenstuhl Fahrbar">
        <option value="Umzug Bett">
        <option value="Urinflaschenset">
        <option value="Weichlagerungsmatratze/Wechseldruckmatratze">
    </datalist>

    <label>Bemerkung:</label>
    <input type="text" id="bemerkung">

    <label>100%:</label>
    <input type="number" id="hundert" value="0">

    <label>50%:</label>
    <input type="number" id="fuenfzig" value="0">

    <label>Info:</label>
    <input type="text" id="info">

    <button id="addEntry">Eintrag speichern</button>
</div>

<hr>

<!-- Tabelle -->
<div class="section">
    <h2>Heutige Einträge</h2>

    <!-- WICHTIG: Der Button, der gefehlt hat!
         Ohne ihn ist app.js abgestürzt. -->
    <button id="sendToDropbox" class="danger-btn">
        📤 Tagesabschluss an Dropbox senden
    </button>

    <div class="table-wrapper">
        <table id="listTable">
            <thead>
                <tr>
                    <th>Barcode</th>
                    <th>Spedition</th>
                    <th>Artikel</th>
                    <th>Bemerkung</th>
                    <th>100%</th>
                    <th>50%</th>
                    <th>Info</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
    </div>
</div>

<!-- Service Worker -->
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
        .then(reg => console.log("SW registered:", reg.scope))
        .catch(err => console.error("SW registration failed:", err));
    });
}
</script>

<!-- Unsere Haupt-App -->
<script type="module" src="app.js"></script>

</body>
</html>
